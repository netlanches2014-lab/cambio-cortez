<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Câmbio Cortez - Painel Administrativo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: #151515;
      border: 1px solid #6b5421;
      border-radius: 28px;
      padding: 36px;
    }

    h1 {
      margin: 0 0 8px;
      color: #f5c451;
      font-size: 34px;
    }

    .subtitle {
      color: #aaaaaa;
      margin-bottom: 30px;
      font-size: 18px;
    }

    .status {
      color: #67d99a;
      margin-bottom: 28px;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #eeeeee;
      font-size: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #444;
      background: #080808;
      color: #fff;
      font-size: 20px;
      outline: none;
    }

    input:focus {
      border-color: #f5c451;
    }

    .rate-box {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .rate-box small {
      display: block;
      margin-top: 10px;
      color: #9a9a9a;
      line-height: 1.5;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
      background: #f5c451;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #2a2a2a;
      color: #fff;
    }

    .msg {
      margin-top: 16px;
      min-height: 24px;
      color: #f5c451;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div id="loginBox">
      <h1>Câmbio Cortez</h1>

      <div class="subtitle">
        Painel administrativo
      </div>

      <label for="password">
        Senha do administrador
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Digite sua senha"
      >

      <button id="loginBtn">
        Entrar
      </button>

      <div id="loginMsg" class="msg"></div>
    </div>


    <div id="adminBox" class="hidden">

      <h1>Cotações</h1>

      <div class="status">
        ● Painel conectado
      </div>

      <div class="rate-box">
        <label for="brlToBob">
          🇧🇷 REAL → BOLIVIANO 🇧🇴
        </label>

        <input
          id="brlToBob"
          type="number"
          step="0.01"
          inputmode="decimal"
          placeholder="Ex.: 2.20"
        >

        <small>
          Quantos bolivianos você paga por cada R$ 1 recebido.
        </small>
      </div>


      <div class="rate-box">
        <label for="bobToBrl">
          🇧🇴 BOLIVIANO → REAL 🇧🇷
        </label>

        <input
          id="bobToBrl"
          type="number"
          step="0.01"
          inputmode="decimal"
          placeholder="Ex.: 2.18"
        >

        <small>
          Quantos bolivianos você recebe para pagar R$ 1.
        </small>
      </div>


      <button id="saveBtn">
        Salvar cotações
      </button>
