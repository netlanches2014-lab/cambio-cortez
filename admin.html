<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Câmbio Cortez</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #151515;
      border: 1px solid #5f491a;
      border-radius: 24px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      color: #f4c95d;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #090909;
      color: white;
      font-size: 17px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #f4c95d;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #2a2a2a;
      color: white;
    }

    .hidden {
      display: none;
    }

    .msg {
      margin-top: 16px;
      min-height: 22px;
      color: #f4c95d;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .status {
      margin-bottom: 20px;
      color: #67d99a;
    }
  </style>
</head>

<body>
  <div class="card">

    <div id="loginBox">
      <h1>Câmbio Cortez</h1>
      <div class="subtitle">Painel administrativo</div>

      <label for="password">Senha do administrador</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Digite sua senha"
      />

      <button id="loginBtn">Entrar</button>

      <div id="loginMsg" class="msg"></div>
    </div>

    <div id="adminBox" class="hidden">
      <h1>Cotações</h1>
      <div class="status">● Painel conectado</div>

      <div class="grid">
        <div>
          <label for="brlBuy">BRL compra</label>
          <input id="brlBuy" type="number" step="0.01" />
        </div>

        <div>
          <label for="brlSell">BRL venda</label>
          <input id="brlSell" type="number" step="0.01" />
        </div>

        <div>
          <label for="bobBuy">BOB compra</label>
          <input id="bobBuy" type="number" step="0.01" />
        </div>

        <div>
          <label for="bobSell">BOB venda</label>
          <input id="bobSell" type="number" step="0.01" />
        </div>
      </div>

      <button id="saveBtn">Salvar cotações</button>
      <button id="logoutBtn" class="secondary">Sair</button>

      <div id="adminMsg" class="msg"></div>
    </div>

  </div>

  <script>
    let token = sessionStorage.getItem("adminToken") || "";

    const loginBox = document.getElementById("loginBox");
    const adminBox = document.getElementById("adminBox");
    const loginMsg = document.getElementById("loginMsg");
    const adminMsg = document.getElementById("adminMsg");

    async function login() {
      loginMsg.textContent = "Entrando...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Não foi possível entrar.");
        }

        token = data.token;
        sessionStorage.setItem("adminToken", token);

        await loadQuotes();
      } catch (error) 
        loginMsg.textContent = error.message;
      }
    }

    async function loadQuotes() {
      try {
        const response = await fetch("/api/admin/quotes", {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Sessão inválida.");
        }

        document.getElementById("brlBuy").value = data.data.brl_buy;
        document.getElementById("brlSell").value = data.data.brl_sell;
        document.getElementById("bobBuy").value = data.data.bob_buy;
        document.getElementById("bobSell").value = data.data.bob_sell;

        loginBox.classList.add("hidden");
        adminBox.classList.remove("hidden");
      } catch (error) {
        sessionStorage.removeItem("adminToken");
        token = "";
        loginBox.classList.remove("hidden");
        adminBox.classList.add("hidden");
      }
    }

    async function saveQuotes() {
      adminMsg.textContent = "Salvando...";

      try {
        const response = await fetch("/api/admin/quotes", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({
            brlBuy: document.getElementById("brlBuy").value,
            brlSell: document.getElementById("brlSell").value,
            bobBuy: document.getElementById("bobBuy").value,
            bobSell: document.getElementById("bobSell").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Não foi possível salvar.");
        }

        adminMsg.textContent = "Cotações atualizadas com sucesso.";
      } catch (error) {
        adminMsg.textContent = error.message;
      }
    }

    async function logout() {
      try {
        await fetch("/api/admin/logout", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + token
          }
        });
      } catch {}

      sessionStorage.removeItem("adminToken
