<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>
    Câmbio Cortez - Painel Administrativo
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #050505;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(213, 161, 40, 0.16),
          transparent 36%
        ),
        #050505;

      color: #ffffff;

      overflow-x: hidden;
      overflow-y: auto;

      padding:
        24px 16px 60px;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .card {
      width: 100%;

      background:
        linear-gradient(
          180deg,
          #171717 0%,
          #101010 100%
        );

      border:
        1px solid
        rgba(213, 161, 40, 0.45);

      border-radius: 28px;

      padding: 30px 24px;

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 86px;
      height: 86px;

      display: grid;
      place-items: center;

      margin:
        0 auto 18px;

      border:
        1px solid
        rgba(213, 161, 40, 0.45);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          #1d1d1d,
          #0d0d0d
        );

      font-size: 42px;
    }

    h1 {
      margin:
        0 0 8px;

      color: #f5c451;

      text-align: center;

      font-size: 34px;
      line-height: 1.1;
    }

    h2 {
      margin:
        34px 0 18px;

      color: #ffffff;

      font-size: 28px;
      line-height: 1.15;
    }

    .subtitle {
      margin-bottom: 28px;

      color: #aaaaaa;

      text-align: center;

      font-size: 17px;
      line-height: 1.5;
    }

    .status {
      margin-bottom: 26px;

      color: #67d99a;

      font-size: 17px;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;

      margin-bottom: 10px;

      color: #ffffff;

      font-size: 18px;
      font-weight: 700;
    }

    input {
      width: 100%;

      padding: 18px;

      border:
        1px solid #444444;

      border-radius: 16px;

      background: #080808;
      color: #ffffff;

      font-size: 20px;

      outline: none;
    }

    input:focus {
      border-color: #f5c451;
    }

    .rate-box {
      width: 100%;

      margin-bottom: 20px;

      padding: 20px;

      background: #0b0b0b;

      border:
        1px solid #292929;

      border-radius: 22px;
    }

    .rate-box small {
      display: block;

      margin-top: 14px;

      color: #9a9a9a;

      font-size: 15px;
      line-height: 1.5;
    }

    button {
      width: 100%;

      margin-top: 16px;

      padding: 17px;

      border: 0;
      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #ffd76a,
          #e9b52d
        );

      color: #111111;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    button.secondary {
      background: #2a2a2a;
      color: #ffffff;
    }

    .msg {
      min-height: 24px;

      margin-top: 16px;

      color: #f5c451;

      font-size: 16px;
      line-height: 1.4;

      text-align: center;
    }


    /* ==========================
       USUÁRIOS
    ========================== */

    #usersList {
      width: 100%;
    }

    .user-card {
      width: 100%;

      margin-bottom: 16px;

      padding: 18px;

      background: #0b0b0b;

      border:
        1px solid #292929;

      border-radius: 18px;
    }

    .user-name {
      margin-bottom: 6px;

      color: #ffffff;

      font-size: 18px;
      font-weight: 800;
    }

    .user-info {
      margin-top: 5px;

      color: #a9a9a9;

      font-size: 14px;
      line-height: 1.5;

      word-break: break-word;
    }

    .user-type {
      display: inline-block;

      margin-top: 12px;

      padding:
        7px 12px;

      border-radius: 999px;

      background:
        rgba(213, 161, 40, 0.14);

      border:
        1px solid
        rgba(213, 161, 40, 0.38);

      color: #f5c451;

      font-size: 13px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .user-action {
      margin-top: 14px;

      padding: 13px;

      font-size: 15px;
    }

    .user-action.client {
      background:
        linear-gradient(
          135deg,
          #ffd76a,
          #e9b52d
        );

      color: #111111;
    }

    .user-action.cambista {
      background: #2a2a2a;
      color: #ffffff;

      border:
        1px solid #454545;
    }

    .users-empty {
      padding: 20px;

      color: #999999;

      text-align: center;

      background: #0b0b0b;

      border:
        1px solid #292929;

      border-radius: 18px;
    }

    .spacer {
      height: 28px;
    }


    @media (
      max-width: 600px
    ) {

      body {
        padding:
          16px 12px 50px;
      }

      .card {
        padding:
          24px 18px;

        border-radius: 22px;
      }

      h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 26px;
      }

      input {
        font-size: 20px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <div class="card">


      <!-- ======================
           LOGIN ADMIN
      ======================= -->

      <div id="loginBox">

        <div class="logo">
          ⚔️
        </div>

        <h1>
          Câmbio Cortez
        </h1>

        <div class="subtitle">
          Painel administrativo
        </div>

        <label for="password">
          Senha do administrador
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Digite sua senha"
        >

        <button id="loginBtn">
          Entrar
        </button>

        <div
          id="loginMsg"
          class="msg"
        ></div>

      </div>



      <!-- ======================
           PAINEL ADMIN
      ======================= -->

      <div
        id="adminBox"
        class="hidden"
      >

        <h1>
          Cotações
        </h1>

        <div class="status">
          ● Painel conectado
        </div>



        <!-- ======================
             CLIENTES
        ======================= -->

        <h2>
          Taxas para CLIENTES
        </h2>


        <div class="rate-box">

          <label for="clienteBrlToBob">
            🇧🇷 REAL → BOLIVIANO 🇧🇴
          </label>

          <input
            id="clienteBrlToBob"
            type="number"
            step="0.001"
            inputmode="decimal"
            placeholder="Ex: 2.165"
          >

          <small>
            Cotação aplicada aos clientes.
          </small>

        </div>


        <div class="rate-box">

          <label for="clienteBobToBrl">
            🇧🇴 BOLIVIANO → REAL 🇧🇷
          </label>

          <input
            id="clienteBobToBrl"
            type="number"
            step="0.001"
            inputmode="decimal"
            placeholder="Ex: 2.190"
          >

          <small>
            Cotação aplicada aos clientes.
          </small>

        </div>



        <!-- ======================
             CAMBISTAS
        ======================= -->

        <h2>
          Taxas para CAMBISTAS
        </h2>


        <div class="rate-box">

          <label for="cambistaBrlToBob">
            🇧🇷 REAL → BOLIVIANO 🇧🇴
          </label>

          <input
            id="cambistaBrlToBob"
            type="number"
            step="0.001"
            inputmode="decimal"
            placeholder="Ex: 2.170"
          >

          <small>
            Cotação especial para cambistas.
          </small>

        </div>


        <div class="rate-box">

          <label for="cambistaBobToBrl">
            🇧🇴 BOLIVIANO → REAL 🇧🇷
          </label>

          <input
            id="cambistaBobToBrl"
            type="number"
            step="0.001"
            inputmode="decimal"
            placeholder="Ex: 2.185"
          >

          <small>
            Cotação especial para cambistas.
          </small>

        </div>



        <!-- ======================
             SALVAR
        ======================= -->

        <button id="saveBtn">
          Salvar cotações
        </button>


        <div
          id="adminMsg"
          class="msg"
        ></div>



        <!-- ======================
             USUÁRIOS
        ======================= -->

        <h2>
          Usuários cadastrados
        </h2>

        <div id="usersList">

          <div class="status">
            Carregando usuários...
          </div>

        </div>



        <!-- ======================
             SAIR
        ======================= -->

        <button
          id="logoutBtn"
          class="secondary"
        >
          Sair
        </button>


        <div class="spacer"></div>

      </div>

    </div>

  </main>


  <script src="/admin.js"></script>

</body>

</html>
